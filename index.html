<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lady Colts Live</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Colts Live"><meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="theme-color" content="#000000"><meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="icon.png"><link rel="icon" href="icon.png">
<style>

:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}.tscroll{overflow-x:auto;-webkit-overflow-scrolling:touch;max-width:100%}nav button,select{min-height:40px}
:root{--bg:#f4f4f4;--card:#fff;--ink:#111;--mute:#666;--line:#e2e2e2;--acc:#111;--ok:#1a7f4b;--bad:#b3282d}
@media (prefers-color-scheme:dark){:root{--bg:#0d0d0d;--card:#1a1a1a;--ink:#ededed;--mute:#a3a3a3;--line:#2e2e2e;--acc:#5c5c5c;--ok:#4cc38a;--bad:#ff7a7e}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 -apple-system,Segoe UI,Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:1000px;margin:0 auto;display:flex;gap:12px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}
h1{margin:0;font-size:22px}header p{margin:4px 0 0;color:var(--mute);font-size:13px}
.gbar{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--mute)}.gbar select{min-width:260px;max-width:100%}
nav{max-width:1000px;margin:8px auto 0;padding:0 16px;display:flex;gap:6px;flex-wrap:wrap}
nav button{border:1px solid var(--line);background:var(--card);color:var(--ink);padding:7px 14px;border-radius:999px;cursor:pointer;font:inherit}
nav button.on{background:var(--acc);color:#fff;border-color:var(--acc)}
main{max-width:1000px;margin:12px auto 40px;padding:0 16px}
.card{background:var(--card);border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:12px;padding:16px 18px;margin-bottom:20px}
.legend{border:1px dashed var(--line);border-radius:8px;padding:10px 14px;margin-top:14px;font-size:13px}.legend ul{margin:4px 0 6px}
.card>h2{margin-top:0;padding-bottom:8px;border-bottom:1px solid var(--line)}
h2{font-size:17px;margin:0 0 10px}h3{font-size:14px;margin:14px 0 6px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:7px 8px;text-align:right;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left}th{color:var(--mute);font-weight:600;font-size:12px}
tr.sel td{background:color-mix(in srgb,var(--acc) 12%,var(--card))}tr.pick{cursor:pointer}tr.pick:hover td{background:color-mix(in srgb,var(--mute) 12%,var(--card))}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px 12px}.kpi b{display:block;font-size:22px}.kpi span{color:var(--mute);font-size:12px}
.W{color:var(--ok);font-weight:600}.L{color:var(--bad);font-weight:600}
select{font:inherit;padding:7px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
ul{margin:6px 0 0;padding-left:20px}li{margin:4px 0}.note{color:var(--mute);font-size:13px}
.warn{border-left:3px solid var(--acc);padding:8px 12px;background:var(--bg);border-radius:6px;font-size:13px;color:var(--mute)}
@media(max-width:600px){table{font-size:12.5px}th,td{padding:6px 4px}.gbar select{min-width:0;width:100%}}
@media print{
  @page{size:landscape;margin:.4in}
  :root{--bg:#fff;--card:#fff;--ink:#111;--mute:#555;--line:#ccc;--acc:#111;--ok:#1a7f4b;--bad:#b3282d}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  body{background:#fff;font-size:12px}
  .noprint,nav,.gbar{display:none!important}
  .printonly{display:block!important}
  body.printing main{display:none!important}
  .psec{break-before:page}.psec:first-child{break-before:auto}
  .ph{font-size:18px;margin:0 0 8px;color:var(--ink)}
  header{padding:0 0 6px}main{margin:0;padding:0;max-width:none}
  .card{break-inside:auto;box-shadow:none;margin-bottom:10px}
  h2,h3{break-after:avoid}tr,.kpi{break-inside:avoid}
  select{appearance:none;-webkit-appearance:none;border:none;background:none;padding:0;font-weight:600}
}
.printonly{display:none}
.sheet{font-size:14px;line-height:1.35}.sheet ul{margin:2px 0;padding-left:16px}.sheet li{margin:3px 0}.sheet h3{font-size:12px;margin:8px 0 3px}
.gs-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;flex-wrap:wrap}.gs-head h2{font-size:22px;border:none;margin:0;padding:0}
.gs-head button{padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;cursor:pointer}
.gs-m{color:var(--mute);font-size:.88em}.gs-r{color:var(--acc);font-weight:600;font-size:.85em;white-space:nowrap}
.gs-chg{border-left:4px solid var(--acc);padding:5px 10px;margin:8px 0;background:var(--bg);border-radius:6px;font-size:.92em}
.gs-kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:8px 0}.gs-k{border:1px solid var(--line);border-radius:8px;padding:6px 8px;line-height:1.25}
.gs-k b{display:block;font-size:19px}.gs-k span{display:block;font-size:12px}.gs-k .gs-r,.gs-k .gs-m{font-size:11px}
.gs-cols{display:grid;grid-template-columns:1fr;gap:4px 18px}@media (min-width:900px){.gs-cols{grid-template-columns:1.45fr 1fr .8fr}}@media (max-width:600px){.gs-kpis{grid-template-columns:repeat(2,1fr)}}
@media print{.sheet{font-size:11px}.gs-cols{grid-template-columns:1.45fr 1fr .8fr}}
.gradTag{color:var(--bad);font-weight:600;font-size:.9em;white-space:nowrap}
.areaTag{display:inline-block;font-size:12px;font-weight:700;padding:1px 8px;margin-left:4px;border-radius:999px;border:1px solid var(--ink);color:var(--ink);white-space:nowrap;vertical-align:1px}

@media print{.sheet{border:none;padding:0}.sheet .kpi b{font-size:18px}.sheet li{margin:3px 0}.cols{grid-template-columns:1fr 1fr}}
.lv{touch-action:manipulation;-webkit-user-select:none;user-select:none}
.lv-flag{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:#000;color:#fff;border-radius:14px;padding:14px 18px;margin-bottom:14px;border:2px solid #fff;outline:2px solid #000}
.lv-logo{width:76px;height:76px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none}.lv-logo img{width:56px;height:auto}
.lv-who{flex:1;min-width:200px}.lv-us{font-size:14px;letter-spacing:.14em;text-transform:uppercase;opacity:.85;font-weight:700}
.lv-vs{font-size:30px;font-weight:800;line-height:1.1}.lv-meta{font-size:14px;opacity:.85;margin-top:2px}.lv-meta a{color:#fff}
.lv-pick{display:flex;flex-direction:column;gap:4px;font-size:12px;opacity:.95}.lv-pick select,.lv-pick input{font:inherit;font-size:15px;padding:8px 10px;border-radius:8px;border:none;min-width:240px;max-width:100%}
.lv-pick button{font:inherit;font-size:15px;padding:8px 14px;border-radius:8px;border:none;background:var(--acc);color:#fff;margin-left:6px}
.lv-net{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:10px 14px;margin-bottom:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);font-size:15px;font-weight:600}
.lv-net i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--ok)}
.lv-net.busy i{background:var(--mute)}.lv-net.warn i{background:#c77700}.lv-net.off i{background:var(--bad)}
.lv-net.off{border-color:var(--ink);border-width:2px}
.lv-netb{display:flex;gap:8px;flex-wrap:wrap}
.lv-net button{min-height:44px;padding:8px 16px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.lv-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px}
.lv-qs{display:flex;gap:6px;flex-wrap:wrap}
.lv-q{min-width:58px;padding:12px 14px;font:inherit;font-weight:700;font-size:17px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
.lv-q.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.lv-undo{padding:12px 20px;font:inherit;font-weight:700;font-size:17px;border-radius:10px;border:2px solid var(--ink);background:var(--card);color:var(--ink)}.lv-undo:disabled{opacity:.35}
.lv-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:900px){.lv-grid{grid-template-columns:repeat(4,1fr)}}
.lv-tile{background:var(--card);border:1px solid var(--line);border-top:5px solid var(--ink);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:4px}

.lv-top{display:flex;justify-content:space-between;align-items:center}.lv-name{font-weight:700;font-size:17px}
.lv-minus{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--mute);font-size:24px;line-height:1}
.lv-num{font-size:56px;font-weight:800;line-height:1;text-align:center;margin-top:4px}.lv-sub{text-align:center;color:var(--mute);font-size:14px}
.lv-plus{margin-top:8px;height:110px;border:none;border-radius:12px;background:var(--ink);color:var(--card);font-size:64px;font-weight:700;line-height:1}
.lv-plus:active{transform:scale(.97);filter:brightness(.9)}
.lv-srow{display:grid;grid-template-columns:minmax(150px,1fr) 1fr 1fr;gap:10px;align-items:center;margin:10px 0}.lv-slbl{display:flex;flex-direction:column;line-height:1.25}.lv-slbl b{font-size:17px}.lv-slbl span{font-size:15px}
.lv-sbtn{height:72px;border:none;border-radius:12px;background:var(--ink);color:var(--card);font:inherit;font-size:22px;font-weight:800}.lv-sbtn:active{transform:scale(.97);filter:brightness(.85)}
.lv-pts{float:right;font-size:22px}
@keyframes swL{from{opacity:.3;transform:translateX(40px)}to{opacity:1;transform:none}}@keyframes swR{from{opacity:.3;transform:translateX(-40px)}to{opacity:1;transform:none}}main.swL{animation:swL .22s ease-out}main.swR{animation:swR .22s ease-out}
.lv-torow{display:flex;align-items:center;gap:12px;margin:8px 0;flex-wrap:wrap}.lv-torow b{width:96px}.lv-torow>div{display:flex;gap:8px;flex-wrap:wrap;flex:1}
.lv-pill{min-width:70px;padding:12px 10px;border-radius:999px;border:2px solid var(--ink);background:var(--card);color:var(--ink);font:inherit;font-weight:700}
.lv-pill.used{background:var(--ink);color:var(--card);opacity:.55;text-decoration:line-through}

.lv-log{list-style:none;padding:0;margin:0}.lv-log li{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:4px 0}
.lv-log button{width:40px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--mute)}
.lv-clear{margin-top:10px;padding:10px 16px;border-radius:10px;border:1px solid var(--bad);background:none;color:var(--bad);font:inherit}
.lv-toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,140%);background:#000;color:#fff;padding:12px 16px;border:1px solid #555;border-radius:12px;display:flex;gap:14px;align-items:center;font-size:16px;transition:transform .2s;z-index:60;box-shadow:0 6px 20px rgba(0,0,0,.25)}
.lv-toast.on{transform:translate(-50%,0)}.lv-toast button{background:#fff;color:#000!important;color:#fff;border:none;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700}
.hlogo{height:30px;vertical-align:-6px;margin-right:8px;filter:grayscale(1) brightness(.6)}.lv-logo img{filter:grayscale(1) brightness(.6)}
@media (prefers-color-scheme:dark){.hlogo{filter:grayscale(1) invert(1)}}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
#app{max-width:1100px;margin:0 auto;padding:14px 14px 80px}
#ready{text-align:center;color:var(--mute);font-size:13px;margin:10px 0 0}
button{touch-action:manipulation}

['Nov 30','Mon','Colbert County','Home',''],['Dec 3','Thu','Hatton','Home',''],['Dec 4','Fri','Lawrence County','Away',''],['Dec 8','Tue','Lauderdale County','Home',''],
['Dec 11','Fri','West Limestone','Away',''],['Dec 15','Tue','Elkmont','Away',''],['Dec 17','Thu','Tanner','Away','Rescheduled from Nov 10'],['Dec 22','Tue','Priceville','Home',''],['Dec 28-29','Mon-Tue','West Morgan Tourney','Away','Tournament, teams TBA'],
['Jan 5','Tue','Priceville','Away',''],['Jan 8','Fri','Lauderdale County','Away',''],['Jan 9-16','Sat-Sat','County Tourney at West','Away','Tournament, teams TBA'],
['Jan 19','Tue','Elkmont','Home',''],['Jan 21','Thu','West Limestone','Home',''],['Jan 22','Fri','East Lawrence','Away',''],['Jan 25','Mon','Hatton','Away',''],
['Jan 26','Tue','Ardmore','Away',''],['Jan 28','Thu','Colbert County','Away',''],['Feb 2','Mon','Wilson','Home','']];
const LV_STATS=[
  {k:'stl',l:'Steals',good:true},
  {k:'defl',l:'Deflections',good:true},
  {k:'dive',l:'Dives on Floor',good:true},
  {k:'to',l:'Turnovers',good:false}];
const LV_SHOTS=[{m:'2m',x:'2x',l:'2-pointers',p:2},{m:'3m',x:'3x',l:'3-pointers',p:3},{m:'fm',x:'fx',l:'Free throws',p:1}];
const LV_LBL={tf:'Full timeout',t30:'30-second timeout','2m':'2PT make','2x':'2PT miss','3m':'3PT make','3x':'3PT miss',fm:'FT make',fx:'FT miss'};LV_STATS.forEach(s=>LV_LBL[s.k]=s.l);
const lvL=k=>LV_LBL[k]||k;
const LV_TO_FULL=3,LV_TO_30=2;   /* NFHS high school: 3 full (60-second) + 2 thirty-second per game; +1 full per overtime */
const LV_MON={Oct:9,Nov:10,Dec:11,Jan:0,Feb:1,Mar:2};
const lvDate=s=>{const m=String(s).match(/^([A-Za-z]{3})\s+(\d+)/);if(!m||LV_MON[m[1]]==null)return null;const mo=LV_MON[m[1]];return new Date(mo>=9?2026:2027,mo,+m[2])};
const lvSlug=t=>String(t||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
const LV_GAMES=UPC.filter(r=>!/tourn|classic|tourney/i.test(r[2]+r[4])).map(r=>({key:'2627-'+lvSlug(r[0]+'-'+r[2]),opp:r[2],date:r[0],day:r[1],ha:r[3],d:lvDate(r[0])}));
let LV_KEY=null,LV_Q='1',LV={},LV_CLEAR=0,LV_MSG='',LV_WAKE=null,LV_EL=null;
try{LV_KEY=localStorage.lvKey||null;LV_Q=localStorage.lvQ||'1'}catch(e){}
function lvDefaultKey(){const t=new Date();t.setHours(0,0,0,0);const g=LV_GAMES.find(g=>g.d&&g.d>=t);return (g||LV_GAMES[LV_GAMES.length-1]).key}
function lvGame(key){const g=LV_GAMES.find(x=>x.key===key);if(g)return g;const v=LV[key];return v?{key,opp:v.opp||'Opponent',date:v.date||'',day:'',ha:v.ha||'',custom:true}:null}
const lvBlank=g=>({opp:g.opp,date:g.date,ha:g.ha,ev:[],del:[],updated:null});
function lvLocal(key){try{return JSON.parse(localStorage.getItem('lv:'+key)||'null')}catch(e){return null}}
function lvLocalSave(key,v){try{localStorage.setItem('lv:'+key,JSON.stringify(v))}catch(e){}}
const lvQs=v=>{const q=['1','2','3','4'];const ot=Math.max(0,...v.ev.map(e=>/^OT(\d)$/.test(e.q)?+e.q.slice(2):0),/^OT(\d)$/.test(LV_Q)?+LV_Q.slice(2):0);for(let i=1;i<=ot;i++)q.push('OT'+i);return q};
const lvQName=q=>/^OT/.test(q)?q:'Q'+q;
function lvToast(t,undo){const el=document.getElementById('lvToast');if(!el)return;el.innerHTML=`<span>${esc(t)}</span>${undo?'<button id="lvTU">Undo</button>':''}`;el.classList.add('on');clearTimeout(lvToast.t);lvToast.t=setTimeout(()=>el.classList.remove('on'),3500);const b=el.querySelector('#lvTU');if(b)b.onclick=()=>{lvUndo();el.classList.remove('on')}}
function lvUndo(){const v=LV[LV_KEY];const e=v.ev.pop();if(!e){lvToast('Nothing to undo');return}(v.del=v.del||[]).push(e.t);lvSave(LV_KEY);lvPaint();lvToast('Undid '+lvL(e.k))}
function lvMinus(k){const v=LV[LV_KEY];for(let i=v.ev.length-1;i>=0;i--)if(v.ev[i].k===k){(v.del=v.del||[]).push(v.ev[i].t);v.ev.splice(i,1);lvSave(LV_KEY);lvPaint();const s=LV_STATS.find(x=>x.k===k);lvToast('Removed one '+(s?s.l:'timeout'));return}lvToast('None to remove')}
function lvRemoveAt(t){const v=LV[LV_KEY];const i=v.ev.findIndex(e=>e.t===t);if(i<0)return;(v.del=v.del||[]).push(t);v.ev.splice(i,1);lvSave(LV_KEY);lvPaint()}
async function lvWake(){try{if(!LV_WAKE&&navigator.wakeLock){LV_WAKE=await navigator.wakeLock.request('screen');LV_WAKE.addEventListener('release',()=>LV_WAKE=null)}}catch(e){}}
function lvAdd(k){const v=LV[LV_KEY];let t=Date.now();while(v.ev.some(e=>e.t===t)||(v.del||[]).includes(t))t++;v.ev.push({k,q:LV_Q,t});lvSave(LV_KEY);lvWake();lvPaint();
  lvToast((k==='tf'||k==='t30')?lvL(k)+' used':`${lvL(k)}${LV_STATS.some(s=>s.k===k)?' +1':''} (${lvQName(LV_Q)})`,true)}
function lvTOs(v){
  const qs=lvQs(v),ots=qs.filter(q=>/^OT/.test(q)).length;
  const full=v.ev.filter(e=>e.k==='tf'),thirty=v.ev.filter(e=>e.k==='t30');
  return {fullMax:LV_TO_FULL+ots,full,thirty,ots};
}
/* this app never needs the internet: every tap goes straight into this iPad's storage */
function lvSave(key){const v=LV[key];v.updated=new Date().toISOString();lvLocalSave(key,v);lvNet()}
function lvNet(){const el=document.getElementById('lvNet');if(!el)return;const n=Object.keys(LV).filter(k=>LV[k].ev&&LV[k].ev.length).length;
  el.className='lv-net off';el.innerHTML=`<span><i></i>Offline app. Every tap is saved on this iPad. ${n} game${n===1?'':'s'} with stats.</span><span class="lv-netb">${navigator.onLine===false?'No internet needed':''}</span>`}
function lvSwitch(key){LV_KEY=key;LV_Q='1';try{localStorage.lvKey=key;localStorage.lvQ='1'}catch(e){}if(!LV[key])LV[key]=lvLocal(key)||lvBlank(lvGame(key)||{opp:'Opponent',date:'',ha:''});lvPaint()}
async function lvExport(keys){
  const games={};keys.forEach(k=>{const v=LV[k];if(v&&v.ev&&v.ev.length)games[k]={opp:v.opp,date:v.date,ha:v.ha||'',ev:v.ev.map(e=>({k:e.k,q:e.q,t:e.t})),updated:v.updated}});
  const n=Object.keys(games).length;if(!n){lvToast('No stats to send yet');return}
  const one=n===1?games[Object.keys(games)[0]]:null,name='Lady Colts Live - '+(one?(one.date+' '+one.opp):'all games')+'.json';
  const txt=JSON.stringify({app:'lady-colts-live',exported:new Date().toISOString(),games});
  try{const f=new File([txt],name,{type:'application/json'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],title:name});lvToast('Sent '+n+' game'+(n>1?'s':''));return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type:'application/json'}));a.download=name;document.body.appendChild(a);a.click();a.remove();lvToast('Saved '+name);
}
function lvPaint(){
  const m=LV_EL;if(!m||!m.isConnected)return;
  const g=lvGame(LV_KEY),v=LV[LV_KEY];if(!g||!v)return;
  const qs=lvQs(v);if(!qs.includes(LV_Q))LV_Q='1';
  const cnt=(k,q)=>v.ev.filter(e=>e.k===k&&(q==null||e.q===q)).length;
  const pts=LV_SHOTS.reduce((a,s)=>a+s.p*cnt(s.m),0),fgm=cnt('2m')+cnt('3m'),fga=fgm+cnt('2x')+cnt('3x');
  const T=lvTOs(v),fullLeft=T.fullMax-T.full.length,thirtyLeft=LV_TO_30-T.thirty.length;
  const pill=(e,i,kind)=>e?`<button class="lv-pill used" data-rm="${e.t}" title="Tap to give it back">${lvQName(e.q)}</button>`:`<button class="lv-pill" data-to="${kind}">${kind==='tf'?'Full':'30s'}</button>`;
  const fullP=[...Array(T.fullMax)].map((_,i)=>pill(T.full[i],i,'tf')).join(''),thP=[...Array(LV_TO_30)].map((_,i)=>pill(T.thirty[i],i,'t30')).join('');
  const recent=[...v.ev].reverse().slice(0,12);
  const opts=LV_GAMES.map(x=>`<option value="${x.key}">${esc(x.date)} · ${x.ha==='Home'?'vs':'@'} ${esc(x.opp)}</option>`).join('')
    +Object.keys(LV).filter(k=>!LV_GAMES.some(x=>x.key===k)).map(k=>`<option value="${k}">${esc(LV[k].date||'')} · vs ${esc(LV[k].opp||'')}</option>`).join('')
    +'<option value="__new">+ Other opponent (tournament)…</option>';
  m.innerHTML=`
  <div class="lv-flag">
    <div class="lv-logo"><img alt="Clements horseshoe" src="${WM_SRC}"></div>
    <div class="lv-who"><div class="lv-us">Lady Colts</div><div class="lv-vs">${g.ha==='Away'?'@':'vs'} ${esc(g.opp)}</div>
      <div class="lv-meta">${esc([g.day,g.date].filter(Boolean).join(' '))}${g.ha?' · '+esc(g.ha):''}</div></div>
    <div class="lv-pick"><label for="lvSel">Game</label><select id="lvSel">${opts}</select>
      <div id="lvNew" style="display:none;margin-top:6px"><input id="lvOpp" placeholder="Opponent name"><button id="lvGo">Start</button></div></div>
  </div>
  <div class="lv-net" id="lvNet"></div>
  <div class="lv-bar">
    <div class="lv-qs">${qs.map(q=>`<button class="lv-q${q===LV_Q?' on':''}" data-q="${q}">${lvQName(q)}</button>`).join('')}<button class="lv-q" data-q="+OT">+ OT</button></div>
    <button class="lv-undo" id="lvUndo"${v.ev.length?'':' disabled'}>↶ Undo last</button>
  </div>
  <div class="lv-grid">${LV_STATS.map(s=>`
    <div class="lv-tile">
      <div class="lv-top"><span class="lv-name">${s.l}</span><button class="lv-minus" data-minus="${s.k}" aria-label="Remove one ${s.l}">−</button></div>
      <div class="lv-num">${cnt(s.k)}</div>
      <div class="lv-sub">${lvQName(LV_Q)}: ${cnt(s.k,LV_Q)}</div>
      <button class="lv-plus" data-add="${s.k}" aria-label="Add ${s.l}">+</button>
    </div>`).join('')}</div>
  <div class="card lv-shoot"><h2>Shooting <span class="lv-pts">${pts} pts</span><span class="note"> · FG ${fgm}/${fga}${fga?' ('+Math.round(100*fgm/fga)+'%)':''}</span></h2>${LV_SHOTS.map(s=>{const a=cnt(s.m)+cnt(s.x),mm=cnt(s.m);return `<div class="lv-srow"><div class="lv-slbl"><b>${s.l}</b><span>${mm}/${a}${a?' · '+Math.round(100*mm/a)+'%':''}</span><span class="note">${lvQName(LV_Q)}: ${cnt(s.m,LV_Q)}/${cnt(s.m,LV_Q)+cnt(s.x,LV_Q)}</span></div><button class="lv-sbtn" data-add="${s.m}">Make</button><button class="lv-sbtn" data-add="${s.x}">Miss</button></div>`}).join('')}</div>
  <div class="card lv-tos"><h2>Timeouts <span class="note">· tap one when we use it, tap a used one to give it back</span></h2>
    <div class="lv-torow"><b>Full</b><div>${fullP}</div><span class="${fullLeft?'':'L'}">${fullLeft} left</span></div>
    <div class="lv-torow"><b>30-second</b><div>${thP}</div><span class="${thirtyLeft?'':'L'}">${thirtyLeft} left</span></div>
    <p class="note">High school (NFHS): 3 full and 2 thirty-second timeouts per game; unused ones carry over, and each overtime adds 1 full.</p></div>
  <div class="card"><h2>By quarter</h2><div style="overflow:auto"><table><tr><th>Stat</th>${qs.map(q=>`<th>${lvQName(q)}</th>`).join('')}<th>Total</th></tr>
    ${LV_STATS.map(s=>`<tr><td>${s.l}</td>${qs.map(q=>`<td>${cnt(s.k,q)}</td>`).join('')}<td><b>${cnt(s.k)}</b></td></tr>`).join('')}
    ${LV_SHOTS.map(s=>`<tr><td>${s.l}</td>${qs.map(q=>`<td>${cnt(s.m,q)}/${cnt(s.m,q)+cnt(s.x,q)}</td>`).join('')}<td><b>${cnt(s.m)}/${cnt(s.m)+cnt(s.x)}</b></td></tr>`).join('')}
    <tr><td>Points</td>${qs.map(q=>`<td>${LV_SHOTS.reduce((a,s)=>a+s.p*cnt(s.m,q),0)}</td>`).join('')}<td><b>${pts}</b></td></tr>
    <tr><td>Timeouts</td>${qs.map(q=>`<td>${v.ev.filter(e=>(e.k==='tf'||e.k==='t30')&&e.q===q).length||''}</td>`).join('')}<td><b>${T.full.length+T.thirty.length}</b></td></tr></table></div></div>
  <div class="card"><h2>Recent taps</h2>${recent.length?`<ul class="lv-log">${recent.map(e=>{return `<li><span>${new Date(e.t).toLocaleTimeString([], {hour:'numeric',minute:'2-digit',second:'2-digit'})} · ${lvQName(e.q)} · <b>${esc(lvL(e.k))}</b></span><button data-rm="${e.t}" aria-label="Remove">✕</button></li>`}).join('')}</ul>`:'<p class="note">Nothing yet. Tap a + to start.</p>'}
    <p class="note" style="margin-top:10px"><span id="lvSave">${esc(LV_MSG||(v.updated?'Saved on this iPad':'Not started'))}</span> · Only Clements stats are tracked here.</p>
    <button class="lv-clear" id="lvClear">${LV_CLEAR&&Date.now()-LV_CLEAR<4000?'Tap again to clear this game':'Clear this game'}</button></div>
  <div class="card"><h2>Send to the dashboard</h2><p class="note" style="margin:0 0 8px">After the game, tap Send and save the file (Save to Files works with no internet). Later, open the dashboard, go to Live Game Stats, tap Import file and pick it.</p>
    <button class="lv-undo" id="lvSend">Send this game</button> <button class="lv-undo" id="lvSendAll" style="margin-left:6px">Send all games</button></div>
  <div id="lvToast" class="lv-toast"></div>`;
  lvNet();
  const sel=m.querySelector('#lvSel');sel.value=LV_KEY;
  sel.onchange=()=>{if(sel.value==='__new'){m.querySelector('#lvNew').style.display='block';m.querySelector('#lvOpp').focus();return}lvSwitch(sel.value)};
  const go=m.querySelector('#lvGo');go.onclick=()=>{const o=m.querySelector('#lvOpp').value.trim();if(!o)return;const t=new Date(),ds=t.toLocaleDateString('en-US',{month:'short',day:'numeric'});const key='2627-'+lvSlug(ds+'-'+o);LV[key]=LV[key]||{opp:o,date:ds,ha:'',ev:[],updated:null};lvSwitch(key)};
  m.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>lvAdd(b.dataset.add));
  m.querySelectorAll('[data-minus]').forEach(b=>b.onclick=()=>lvMinus(b.dataset.minus));
  m.querySelectorAll('[data-to]').forEach(b=>b.onclick=()=>lvAdd(b.dataset.to));
  m.querySelectorAll('[data-rm]').forEach(b=>b.onclick=()=>{const e=LV[LV_KEY].ev.find(x=>x.t===+b.dataset.rm);lvRemoveAt(+b.dataset.rm);if(e)lvToast('Removed '+lvL(e.k))});
  m.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{let q=b.dataset.q;if(q==='+OT'){const n=qs.filter(x=>/^OT/.test(x)).length;if(LV_Q!=='4'&&!/^OT/.test(LV_Q)&&!n){lvToast('Overtime comes after Q4');return}q='OT'+(n+1)}LV_Q=q;try{localStorage.lvQ=q}catch(e){}lvPaint()});
  m.querySelector('#lvUndo').onclick=lvUndo;
  m.querySelector('#lvSend').onclick=()=>lvExport([LV_KEY]);m.querySelector('#lvSendAll').onclick=()=>lvExport(Object.keys(LV));
  m.querySelector('#lvClear').onclick=()=>{if(LV_CLEAR&&Date.now()-LV_CLEAR<4000){LV_CLEAR=0;{const w=LV[LV_KEY];w.del=(w.del||[]).concat(w.ev.map(e=>e.t));w.ev=[]}lvSave(LV_KEY);lvPaint();lvToast('Game cleared')}else{LV_CLEAR=Date.now();lvPaint();setTimeout(()=>{if(LV_CLEAR&&Date.now()-LV_CLEAR>=4000){LV_CLEAR=0;lvPaint()}},4100)}};
}
/* start: load every game saved on this iPad, open today's (or the next) game */
try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k&&k.indexOf('lv:')===0){const v=lvLocal(k.slice(3));if(v&&Array.isArray(v.ev))LV[k.slice(3)]=v}}}catch(e){}
LV_EL=document.querySelector('.lv');
if(!LV_KEY||!lvGame(LV_KEY))LV_KEY=lvDefaultKey();
if(!LV[LV_KEY])LV[LV_KEY]=lvBlank(lvGame(LV_KEY));
lvPaint();
window.addEventListener('online',lvNet);window.addEventListener('offline',lvNet);
if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').then(()=>{const r=document.getElementById('ready');if(r)r.textContent='Ready to use with no internet.'}).catch(()=>{const r=document.getElementById('ready');if(r)r.textContent='Open this page once from its web link to make it work offline.'})}
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}

</script></body></html>
